name: Windows CMake Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test video transform
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release "build/Release/ProjectionMappingStudio.exe"
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: ProjectionMappingStudio-Windows-x64
          path: build/Release/
          if-no-files-found: error
